name: Curate Pegasus release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: Immutable v3.1.1-rc.1 tag to curate for v3.1.1 promotion
        required: true
        type: string
      release_stage:
        description: Publish v3.1.1-rc.1 for acceptance, or promote its accepted aggregate to final
        required: true
        default: rc
        type: choice
        options:
          - rc
          - final
      final_tag:
        description: Immutable final tag; only v3.1.1 is accepted
        required: true
        default: v3.1.1
        type: string
      promotion_rc_tag:
        description: Manually accepted v3.1.1-rc.1 promotion input
        required: true
        default: v3.1.1-rc.1
        type: string
      accepted_v311_rc1_aggregate_b64:
        description: Base64-encoded accepted v3.1.1-rc.1 aggregate evidence
        required: true
        type: string

jobs:
  publish-v3-1-1-rc:
    if: ${{ inputs.release_stage == 'rc' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rc_tag }}
      - name: Build RC archive evidence only
        run: |
          set -euo pipefail
          test "$(git cat-file -t "${{ inputs.rc_tag }}")" = tag
          test "${{ inputs.rc_tag }}" = v3.1.1-rc.1
          python3 tools/validate_snapshot.py
          python3 tools/build_release_manifest.py --tag "${{ inputs.rc_tag }}" --archive "dist/pegasus-harness-${{ inputs.rc_tag }}.tar.gz" --output dist/release-manifest.json
      - name: Publish RC assets for isolated acceptance
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.1-rc.1
          draft: false
          prerelease: true
          files: |
            dist/pegasus-harness-v3.1.1-rc.1.tar.gz
            dist/pegasus-harness-v3.1.1-rc.1.tar.gz.sha256
            dist/release-manifest.json
      - name: Preserve manual promotion gate
        run: |
          set -euo pipefail
          test ! -e dist/rc-acceptance-evidence.json
          printf '%s\n' 'Manual acceptance must create rc-acceptance-evidence.json before an operator promotes immutable v3.1.1-rc.1 to v3.1.1.'

  publish-v3-1-1-final:
    if: ${{ inputs.release_stage == 'final' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.promotion_rc_tag }}
      - name: Verify immutable final promotion input
        run: |
          set -euo pipefail
          test "${{ inputs.final_tag }}" = v3.1.1
          test "${{ inputs.promotion_rc_tag }}" = v3.1.1-rc.1
          test "${{ inputs.rc_tag }}" = "${{ inputs.promotion_rc_tag }}"
          test "$(git cat-file -t v3.1.1-rc.1)" = tag
          ! git rev-parse -q --verify refs/tags/v3.1.1
      - name: Download v3.1.1-rc.1 release assets that acceptance identified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir v311-rc1-input
          gh release download "${{ inputs.promotion_rc_tag }}" --repo "${{ github.repository }}" --dir v311-rc1-input \
            --pattern 'pegasus-harness-v3.1.1-rc.1.tar.gz' \
            --pattern 'pegasus-harness-v3.1.1-rc.1.tar.gz.sha256' \
            --pattern 'release-manifest.json'
      - name: Validate accepted v3.1.1-rc.1 aggregate promotion evidence
        env:
          ACCEPTED_V311_RC1_AGGREGATE_B64: ${{ inputs.accepted_v311_rc1_aggregate_b64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ACCEPTED_V311_RC1_AGGREGATE_B64" | base64 --decode > v311-rc1-input/rc-acceptance-aggregate.json
          python3 scripts/validate-v3-acceptance-aggregate.py \
            --aggregate v311-rc1-input/rc-acceptance-aggregate.json \
            --rc-archive v311-rc1-input/pegasus-harness-v3.1.1-rc.1.tar.gz \
            --rc-checksum v311-rc1-input/pegasus-harness-v3.1.1-rc.1.tar.gz.sha256 \
            --release-manifest v311-rc1-input/release-manifest.json
      - name: Create immutable same-commit final tag after acceptance
        run: |
          set -euo pipefail
          ! git rev-parse -q --verify refs/tags/v3.1.1
          rc_commit="$(git rev-list -n 1 v3.1.1-rc.1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v3.1.1 "$rc_commit" -m 'Pegasus Harness v3.1.1'
          test "$(git rev-list -n 1 v3.1.1)" = "$rc_commit"
          git push origin refs/tags/v3.1.1
      - name: Build final archive, checksum, and manifest
        run: |
          set -euo pipefail
          python3 tools/validate_snapshot.py
          python3 tools/build_release_manifest.py \
            --tag v3.1.1 --promotion-rc-tag v3.1.1-rc.1 \
            --archive dist/pegasus-harness-v3.1.1.tar.gz \
            --output dist/release-manifest.json
          test -f dist/pegasus-harness-v3.1.1.tar.gz
          test -f dist/pegasus-harness-v3.1.1.tar.gz.sha256
          test -f dist/release-manifest.json
      - name: Publish final latest-capable asset set
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.1
          draft: false
          prerelease: false
          files: |
            dist/pegasus-harness-v3.1.1.tar.gz
            dist/pegasus-harness-v3.1.1.tar.gz.sha256
            dist/release-manifest.json
